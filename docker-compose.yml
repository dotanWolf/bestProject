version: '3.8'

services:
  cpp-server:
    build: ./src/CPPServer
    environment:
      - RLE_DIR=/app/data
      - THREAD_POOL_SIZE=5
    ports:
      - "9120:9120"
    volumes:
      - files:/app/data

  api:
    build: ./src/MVC
    ports:
      - "8080:8080"
    # This ensures the API waits for the C++ server to be ready
    depends_on:
      - cpp-server

  frontend:
    # Use 'build' for local code, not 'image'
    build: ./src/frontend
    ports:
      - "5173:5173"
    # Optional: adds hot-reload so changes you make in VS Code show up instantly
    volumes:
      - ./src/frontend:/app
      - /app/node_modules

# You MUST declare the named volume here or the build will fail
volumes:
  files:
  mongo-data: # 🚨 ADDED: This declaration is mandatory
