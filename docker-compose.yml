version: "3.8"

services:
  cpp-server:
    build: ./src/CPPServer
    environment:
      - RLE_DIR=/app/data
      - THREAD_POOL_SIZE=5
    ports:
      - "9120:9120"
    volumes:
      - files:/app/data

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db # Persists your database data

  api:
    build: ./src/MVC
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      # 🚨 ADD THIS: Override the env file string to point to the docker service
      - CONNECTION_STRING=mongodb://mongo:27017/myDrive
    env_file:
      - ./src/MVC/config/.env.development
    depends_on:
      - cpp-server
      - mongo # 🚨 ADD THIS: Ensure DB starts before API

  frontend:
    build: ./src/frontend
    ports:
      - "5173:5173"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules

volumes:
  files:
  mongo-data: # 🚨 ADDED: This declaration is mandatory