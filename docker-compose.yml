version: "3.8"

services:
  cpp-server:
    build: ./src/CPPServer
    environment:
      - RLE_DIR=/app/data
      - THREAD_POOL_SIZE=5
    ports:
      - "9120:9120"
    volumes:
      - files:/app/data

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build: ./src/MVC
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - CONNECTION_STRING=mongodb://mongo:27017/myDrive
    env_file:
      - ./src/MVC/config/.env.development
    depends_on:
      - cpp-server
      - mongo

  frontend:
    build: ./src/frontend
    ports:
      - "5173:5173"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules

  # 👇 MOBILE SERVICE USING .ENV FILE 👇
  mobile:
    build: ./src/Native
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    # This tells Docker to load variables from your file
    env_file:
      - ./src/Native/.env
    volumes:
      - ./src/Native:/app
      - /app/node_modules
    stdin_open: true
    tty: true

volumes:
  files:
  mongo-data: